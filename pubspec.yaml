name: kumsserp_student
description: KUMSSERP Student Mobile App - Complete Flutter application for students to manage their academic life.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  get: ^4.6.5

  # Navigation & Routing
  go_router: ^13.0.0

  # HTTP & API
  dio: ^5.4.0

  # Storage
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Forms & Validation
  flutter_form_builder: ^9.1.0
  form_builder_validators: ^10.0.0

  # UI & Design
  cupertino_icons: ^1.0.2
  google_fonts: ^6.1.0
  cached_network_image: ^3.3.0

  # Charts
  fl_chart: ^0.64.0

  # Date & Time
  intl: ^0.19.0

  # Logging
  logger: ^2.1.0

  # Utils
  connectivity_plus: ^5.0.0
  device_info_plus: ^9.1.0

  # PDF & File handling
  pdf: ^3.10.0
  printing: ^5.11.0
  file_picker: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0
  build_runner: ^2.4.0
  hive_generator: ^2.0.0

flutter:
  uses-material-design: true

  # Assets
  assets:
    - assets/images/
    - assets/icons/
    - assets/data/

  # Fonts
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
