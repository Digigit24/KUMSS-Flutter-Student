name: kumsserp_student
description: KUMSSERP Student Mobile App - Complete Flutter application for students to manage their academic life.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  get: ^4.6.5

  # Navigation & Routing
  go_router: ^17.2.2

  # HTTP & API
  dio: ^5.4.0

  # Storage
  flutter_secure_storage: ^10.0.0
  shared_preferences: ^2.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Forms & Validation
  flutter_form_builder: ^10.3.0
  form_builder_validators: ^11.0.0

  # UI & Design
  cupertino_icons: ^1.0.2
  google_fonts: ^8.0.2
  cached_network_image: ^3.3.0

  # Charts
  fl_chart: ^1.2.0

  # Date & Time
  intl: ^0.20.2

  # Logging
  logger: ^2.1.0

  # Utils
  connectivity_plus: ^7.1.1
  device_info_plus: ^12.4.0

  # PDF & File handling
  pdf: ^3.10.0
  printing: ^5.11.0
  file_picker: ^11.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.4.0
  hive_generator: ^2.0.0

flutter:
  uses-material-design: true

